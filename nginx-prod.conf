# ============================================================
# Config à ajouter dans votre nginx HOST (production)
# Placer dans /etc/nginx/sites-available/primehome
# puis : ln -s /etc/nginx/sites-available/primehome /etc/nginx/sites-enabled/
# ============================================================

server {
    listen 443 ssl;
    server_name erp.primehome.ma;   # adapter selon votre domaine

    ssl_certificate     /etc/letsencrypt/live/erp.primehome.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.primehome.ma/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Tout passe vers le Docker nginx sur port 80
    location / {
        proxy_pass         http://localhost:80;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 86400;
    }
}

# Redirection HTTP → HTTPS
server {
    listen 80;
    server_name erp.primehome.ma;
    return 301 https://$host$request_uri;
}
