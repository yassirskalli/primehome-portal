server {
    listen 80;
    server_name _;

    # Timeouts généreux pour le hot-reload Vite (WebSocket HMR)
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;

    # ─── Portail ERP (static) ────────────────────────────
    location = / {
        root /usr/share/nginx/html;
        index index.html;
    }
    location = /index.html {
        root /usr/share/nginx/html;
    }
    location = /logo.png {
        root /usr/share/nginx/html;
        expires 7d;
    }
    location = /showroom.jpg {
        root /usr/share/nginx/html;
        expires 7d;
    }
    location = /primehome-logo.jpg {
        root /usr/share/nginx/html;
        expires 7d;
    }
    location = /primeHomeLogoGood.png {
        root /usr/share/nginx/html;
        expires 7d;
    }
    location /admin {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /admin/index.html;
    }

    # ─── APIs (priorité sur les frontends) ───────────────
    location /commandes/api/ {
        rewrite ^/commandes/api/(.*)$ /$1 break;
        proxy_pass http://erp_api:8000;
        proxy_set_header Host $host;
    }
    location /sav/api/ {
        rewrite ^/sav/api/(.*)$ /api/$1 break;
        proxy_pass http://sav_backend:8000;
        proxy_set_header Host $host;
    }
    location /devis/api/ {
        rewrite ^/devis/api/(.*)$ /$1 break;
        proxy_pass http://devis_backend:8001;
        proxy_set_header Host $host;
    }

    # ─── Order Tracking (/commandes) ─────────────────────
    location /commandes {
        proxy_pass         http://erp_frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ─── SAV (/sav) ──────────────────────────────────────
    location /sav {
        proxy_pass         http://sav_frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ─── Générateur de Devis (/devis) ────────────────────
    location /devis {
        proxy_pass         http://devis_frontend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
