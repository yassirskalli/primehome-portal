server {
    listen 80;
    server_name _;

    # ─── Portail ERP (static) ────────────────────────────
    location = / {
        root /usr/share/nginx/html;
        index index.html;
    }
    location = /index.html {
        root /usr/share/nginx/html;
    }
    location = /logo.png {
        root /usr/share/nginx/html;
        expires 7d;
    }
    location = /showroom.jpg {
        root /usr/share/nginx/html;
        expires 7d;
    }
    location = /primehome-logo.jpg {
        root /usr/share/nginx/html;
        expires 7d;
    }
    location = /primeHomeLogoGood.png {
        root /usr/share/nginx/html;
        expires 7d;
    }

    # ─── Administration (/admin) ─────────────────────────
    location /admin {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /admin/index.html;
    }

    # ─── APIs (priorité sur les frontends) ───────────────
    location /commandes/api/ {
        rewrite ^/commandes/api/(.*)$ /$1 break;
        proxy_pass http://erp_api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /sav/api/ {
        rewrite ^/sav/api/(.*)$ /api/$1 break;
        proxy_pass http://sav_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /devis/api/ {
        rewrite ^/devis/api/(.*)$ /$1 break;
        proxy_pass http://devis_backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ─── Order Tracking (/commandes) ─────────────────────
    # trailing slash strips /commandes prefix before forwarding
    location /commandes {
        proxy_pass http://erp_frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ─── SAV (/sav) ──────────────────────────────────────
    location /sav {
        proxy_pass http://sav_frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ─── Générateur de Devis (/devis) ────────────────────
    location /devis {
        proxy_pass http://devis_frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
